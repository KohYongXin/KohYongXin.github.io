<!DOCTYPE html>

<head>

    <title>Flexbox 1</title>
    <link rel="stylesheet" href="CSS/flexbox1.css">
</head>

<body>

            <img src="images/gs.png" alt="Residential Project" width="100%" height="auto">
            <h2>Residential project</h2>

        <div class="flex-item">
